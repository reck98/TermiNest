[workspace]
resolver = "2"
members = [
    "crates/terminest-protocol",
    "crates/terminest-transport",
    "crates/terminest-core",
    "apps/terminest-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TermiNest Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/terminest/terminest"

[workspace.dependencies]
terminest-protocol = { path = "crates/terminest-protocol" }
terminest-transport = { path = "crates/terminest-transport" }
terminest-core = { path = "crates/terminest-core" }
bytes = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "io-util", "macros", "rt", "time", "fs"] }
async-trait = "0.1"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "std", "now", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
proptest = "1.6"
criterion = "0.5"
tempfile = "3.17"
