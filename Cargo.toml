[workspace]
resolver = "2"
members = [
    "crates/terminest-protocol",
    "crates/terminest-transport",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TermiNest Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/terminest/terminest"

[workspace.dependencies]
terminest-protocol = { path = "crates/terminest-protocol" }
bytes = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "io-util", "macros", "rt", "time"] }
proptest = "1.6"
criterion = "0.5"
